services:
  mysql:
    image: mysql:8.0
    container_name: agenthire-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: agenthire
      MYSQL_USER: agenthire_user
      MYSQL_PASSWORD: agenthire_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: